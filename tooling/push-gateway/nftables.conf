#!/usr/sbin/nft -f
# /etc/nftables.conf on push-01: the API only from the edge, metrics and SSH
# only from the LAN.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    # sygnal API: edge-02 (Traefik) only, plus the host's own checks
    tcp dport 5000 ip saddr { 192.168.3.163, 127.0.0.1 } accept
    # Prometheus metrics and SSH: LAN only
    tcp dport { 22, 8000 } ip saddr 192.168.0.0/16 accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output { type filter hook output priority 0; policy accept; }
}
