name: weft_mcp
description: >-
  MCP server exposing Weft over authenticated Streamable HTTP, plus the
  cloudflared tunnel supervisor. Runs embedded in the desktop app or headless.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.7
  mcp_dart: ^2.4.0
  meta: ^1.17.0
  shelf: ^1.4.2
  weft_domain: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
