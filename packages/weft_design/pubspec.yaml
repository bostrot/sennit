name: weft_design
description: >-
  Weft's design system: colour/typography/motion tokens, theme construction and
  shared components. Every component is golden-tested in light, dark and AMOLED.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Only for `Bidi`'s strong-character classes, which `src/bidi.dart` uses to
  # resolve one message's direction from its own text. Already in the workspace
  # lock — the app and the Matrix SDK both carry it — so this is a declaration
  # rather than a new package, and hand-rolling the Unicode ranges instead would
  # be a second, worse copy of a table that has to stay right.
  intl: any
  simple_icons: ^16.23.0
  weft_domain: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
