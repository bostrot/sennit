name: weft_design
description: >-
  Weft's design system: colour/typography/motion tokens, theme construction and
  shared components. Every component is golden-tested in light, dark and AMOLED.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  simple_icons: ^16.23.0
  weft_domain: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
