name: weft_search
description: >-
  Hybrid search: BM25 and vector kNN fused with Reciprocal Rank Fusion, plus the
  pluggable embedding providers. Storage bindings live behind interfaces so this
  package stays pure Dart and testable.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  http: ^1.6.0
  meta: ^1.17.0
  weft_domain: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
