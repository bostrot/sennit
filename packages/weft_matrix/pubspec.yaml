name: weft_matrix
description: >-
  Wrapper over the Famedly Matrix SDK: session lifecycle, homeserver discovery,
  login, E2EE bootstrap, cross-signing, key backup and device verification.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_vodozemac: ^0.7.1
  http: ^1.6.0
  # Pure Dart, so thumbnail rasterisation needs no platform channel and runs in
  # a plain `compute` isolate — and pins no analyzer version against the SDK.
  image: ^4.5.4
  matrix: ^10.1.0
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # Backs MatrixSdkDatabase. The ffi variant depends only on package:sqlite3,
  # which self-bundles its natives via Dart build hooks, so one code path
  # covers Android, iOS, macOS, Linux and Windows.
  sqflite_common_ffi: ^2.4.2
  weft_attachments: ^0.1.0
  weft_domain: ^0.1.0
  weft_merge: ^0.1.0
  # The notification *decisions* — every suppression rule, the merged-chat group
  # key, body rendering — stay pure Dart in weft_notify. This package only
  # supplies what it cannot know: a decrypted event, a read receipt, and the
  # homeserver to register a pusher with.
  weft_notify: ^0.1.0
  # Relations as values: the aggregation that turns a room's annotations and
  # replacements into a tally and an edit history is pure Dart and tested
  # without a homeserver. This package only supplies the events.
  weft_richtext: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
