name: weft_sms
description: >-
  SMS/MMS logic: phone-number identity, GSM-7 vs UCS-2 segment counting, MMS part
  planning, and the merge evidence that joins an SMS number to a bridged handle.
  Pure Dart, so every rule the Android default-SMS role depends on is testable
  without a device, a SIM or a carrier.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  meta: ^1.17.0
  weft_attachments: ^0.1.0
  weft_domain: ^0.1.0
  # Not in the phase's original dependency list, and deliberately added: the
  # conservative E.164 normaliser this package needs already exists as
  # `normalizePhone` in weft_merge, and it is the *same* function the merge
  # scorer runs on the other side of the comparison. A second normaliser here
  # would not merely duplicate code — it would let an SMS number and a bridged
  # number for the same person normalise differently and silently stop matching.
  # No cycle: weft_merge depends only on weft_domain.
  weft_merge: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
