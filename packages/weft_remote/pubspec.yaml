name: weft_remote
description: >-
  Sennit Web's wire: the domain as JSON, request/response and pushed state
  between a browser and the phone that serves it. Pure Dart, and transport
  agnostic, so both ends are testable in one process.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # Both already in the lock through the matrix SDK. For the bundle's
  # signature, hash and archive.
  archive: ^4.0.9
  cryptography: ^2.9.0
  meta: ^1.17.0
  weft_domain: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
