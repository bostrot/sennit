name: weft_notify
description: >-
  The notification decision layer: whether an event deserves a notification, what
  it should say, and which merged conversation it collapses into. Pure Dart with
  policy and read state injected, so every suppression rule and grouping decision
  is unit-testable without a device, a homeserver, or a push gateway.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  meta: ^1.17.0
  weft_domain: ^0.1.0
  # For the plain-text projection of formatted bodies: a notification says what
  # the message says, never the tags it was written in.
  weft_richtext: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
