name: Set up Flutter
description: >
  Puts a pinned Flutter on PATH, the same way on every runner the workflows use.

  Flutter ships Linux SDK tarballs for x64 only — releases_linux.json carries
  no arm64 entry for any version, 3.44.0 included — so subosito/flutter-action
  has nothing to download on an arm64 Linux runner. A shallow clone of the
  version tag works on every host; the tool then fetches the Dart SDK and
  engine artifacts for the host it finds itself on.

  The clone and the pub cache are kept outside the workspace and restored
  from the Actions cache, so a hosted runner pays for them once per version
  and OS rather than once per job.

inputs:
  flutter-version:
    description: The Flutter tag to install, e.g. 3.44.0
    required: true

runs:
  using: composite
  steps:
    - name: Restore the Flutter SDK
      uses: actions/cache@v4
      with:
        path: ~/.cache/flutter-sdks/${{ inputs.flutter-version }}
        key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flutter-version }}
    # Keyed on the lockfile, which the workspace keeps at the root.
    - name: Restore the pub cache
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flutter-version }}-
    - shell: bash
      run: |
        set -euo pipefail
        root="$HOME/.cache/flutter-sdks/${{ inputs.flutter-version }}"
        # A clone interrupted half way leaves a directory with no usable
        # binary in it, and every later run would then reuse the wreck.
        if [ ! -x "$root/bin/flutter" ]; then
          rm -rf "$root"
          git clone --depth 1 --branch "${{ inputs.flutter-version }}" \
            https://github.com/flutter/flutter.git "$root"
        fi
        # A restored clone is not always owned by the account running the
        # job, and git refuses to read a repository it does not own — which
        # the Flutter tool reports as a version it cannot determine.
        git config --global --add safe.directory "$root"
        echo "$root/bin" >> "$GITHUB_PATH"
        echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"
        "$root/bin/flutter" --version
