name: Promote to the stores

# Every night at 03:00 Berlin time, the newest build testers have — Play's
# internal track, TestFlight — goes to Google Play's open testing track and
# to App Review, provided it landed since the night before, is newer than what the
# store has, and CI and its deploy passed on its commit. The rules are
# tooling/store/promote.py's; why they are what they are is
# docs/decisions/adr-005-daily-store-promotion.md.
#
# Off until the STORE_PROMOTION_ENABLED repository variable is `true`: until
# then the scheduled runs are skipped, and a manual run can only be a dry
# run, which reads both stores and prints what it would do.
on:
  # GitHub's cron is UTC. 03:00 in Berlin is 02:00 UTC in winter and 01:00
  # UTC in summer, so both are scheduled and the script lets only the one
  # whose slot is 03:00 Berlin that day go on.
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  # TEMPORARY: a dry run from this branch before merge; removed before merging.
  push:
    branches: [bostrot/daily-store-promotion]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be promoted, and change nothing
        type: boolean
        default: true
      store:
        description: Which store
        type: choice
        options: [all, play, appstore]
        default: all
      max_age_hours:
        description: Only builds that reached testers this many hours ago or less (0 = any age)
        default: '26'
      audit:
        description: Also list what each store still wants before the first public release
        type: boolean
        default: true

# Two promotions at once would both find the same build new.
concurrency:
  group: store-promotion
  cancel-in-progress: false

permissions:
  contents: read
  # CI's and the deploy workflows' results, for the build's commit.
  actions: read

jobs:
  promote:
    name: Promote the newest tested build
    # A scheduled run with the switch off does nothing at all, not even read.
    if: github.event_name != 'schedule' || vars.STORE_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A build number is a commit count; finding its commit needs all
          # of main.
          fetch-depth: 0

      - name: Only a dry run while the switch is off
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && vars.STORE_PROMOTION_ENABLED != 'true'
        run: |
          echo "::error::STORE_PROMOTION_ENABLED is not true; run with dry_run, or turn it on (docs/RELEASING.md)"
          exit 1

      - name: The store credentials must exist
        env:
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -n "$PLAY" ] || missing="$missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Promote
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional. The Play track: `beta` (open testing) unless this says
          # `production`. A fraction below 1 makes it a staged rollout; `true`
          # for the last skips Play's "send for review".
          PLAY_PROMOTION_TRACK: ${{ vars.PLAY_PROMOTION_TRACK }}
          PLAY_PRODUCTION_ROLLOUT: ${{ vars.PLAY_PRODUCTION_ROLLOUT }}
          PLAY_CHANGES_NOT_SENT_FOR_REVIEW: ${{ vars.PLAY_CHANGES_NOT_SENT_FOR_REVIEW }}
          STORE: ${{ inputs.store || 'all' }}
          SCHEDULE: ${{ github.event.schedule }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '26' }}
          # Changes anything only with the switch on, and then only on the
          # schedule or a manual run with dry_run off.
          APPLY: ${{ vars.STORE_PROMOTION_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && '--apply' || '' }}
          AUDIT: ${{ (github.event_name == 'push' || inputs.audit) && '--audit' || '' }}
        run: |
          python3 tooling/store/promote.py "$STORE" $APPLY $AUDIT \
            --schedule "$SCHEDULE" --max-age-hours "$MAX_AGE_HOURS" \
            --play-track "$PLAY_PROMOTION_TRACK"
