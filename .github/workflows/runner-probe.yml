name: Runner probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux, debian]
    steps:
      - name: What is on this runner
        run: |
          set +e
          echo "=== arch / os ==="
          uname -m; uname -r; (. /etc/os-release && echo "$PRETTY_NAME")
          echo "=== resources ==="
          nproc; free -h | head -3; df -h / /home 2>/dev/null | tail -3
          echo "=== tools on PATH ==="
          for c in git curl wget unzip xz java javac flutter dart go cmake ninja clang pkg-config docker podman qemu-x86_64 qemu-x86_64-static box64 sdkmanager aapt2; do
            printf '%-20s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
          done
          echo "=== java ==="; java -version 2>&1 | head -3
          echo "=== flutter ==="; flutter --version 2>&1 | head -6
          echo "=== android sdk ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" /usr/lib/android-sdk /opt/android-sdk; do
            [ -n "$d" ] && [ -d "$d" ] && { echo "--- $d"; ls -1 "$d"; ls -1 "$d/build-tools" 2>/dev/null; }
          done
          echo "=== binfmt (x86 emulation?) ==="; ls -1 /proc/sys/fs/binfmt_misc 2>&1 | head -20
          echo "=== user / sudo ==="; whoami; id
          sudo -n true 2>/dev/null && echo "passwordless sudo: YES" || echo "passwordless sudo: NO"
          echo "=== runner ==="; echo "RUNNER_ARCH=$RUNNER_ARCH RUNNER_OS=$RUNNER_OS workdir=$RUNNER_WORKSPACE"
          exit 0
