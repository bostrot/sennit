name: Release

# Cutting a release: run tooling/scripts/release.sh <version>, then
#   git push && git push origin v<version>
# Either push is enough. The version bump reaching main publishes the
# release, the same trigger that ships it to Play and TestFlight; the tag is
# the older trigger and still works. pubspec.yaml stays the single source of
# truth: the verify job refuses a tag that doesn't match it, and skips the
# builds when v<version> is already on the release page. 1.0.18 to 1.0.20
# reached both stores and never the release page, because their tags were
# never pushed — that is what the main trigger is for.
#
# The release notes come from tooling/scripts/release_notes.py — the
# committed docs/release-notes/<version>.md, or the history since the last
# release commit — the same text deploy_internal.yml gives Play and
# deploy_testflight.yml gives App Store Connect, worked out from the same
# commit. Nothing here has to run before those, or after.
#
# workflow_dispatch builds all platforms without publishing — a dry run —
# unless `publish` is ticked on main, which releases the version main is at
# if no release has it yet.

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: ['apps/weft/pubspec.yaml']
  workflow_dispatch:
    inputs:
      publish:
        description: On main, publish the pubspec version if it has no release yet
        type: boolean
        default: false

# `git push && git push origin v1.2.0` starts two runs for one release. One
# waits for the other, and its verify job then finds the release and skips.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.0'
  # Which edition each build is: docs/decisions/adr-004-sennit-pro.md.
  #
  # What goes on the release page sells Sennit Pro by licence key — once
  # there is a checkout to send people to. Until the BRAID_CHECKOUT_URL
  # repository variable is set, those builds stay the community edition,
  # because a build that locks features with nowhere to buy them is worse
  # than one that gives them away.
  DIRECT_DEFINES: >-
    --dart-define=BRAID_EDITION=${{ vars.BRAID_CHECKOUT_URL != '' && 'direct' || 'community' }}
    --dart-define=BRAID_CHECKOUT_URL=${{ vars.BRAID_CHECKOUT_URL }}
  # What goes to Play and the App Store sells it in the store, once the
  # BRAID_STORE_EDITION repository variable says `store` — which it should
  # only say when the products exist in both consoles.
  STORE_DEFINES: --dart-define=BRAID_EDITION=${{ vars.BRAID_STORE_EDITION || 'community' }}
  # Which store's rating sheet the build may show (review_prompt.dart); the
  # release page's builds pass none and never ask.
  PLAY_DEFINES: --dart-define=SENNIT_STORE=play
  APP_STORE_DEFINES: --dart-define=SENNIT_STORE=appstore

jobs:
  verify:
    # It only reads the checkout: pubspec.yaml, and the release notes.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.publish.outputs.build }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes fall back to the history since the last release commit.
          fetch-depth: 0
      - name: Read the version from pubspec.yaml
        id: version
        run: |
          VERSION=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' apps/weft/pubspec.yaml)
          [ -n "$VERSION" ] || { echo "pubspec version is not semver+build" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec says $VERSION"
      - name: The tag must match pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [ "$TAG" = "${{ steps.version.outputs.version }}" ] || {
            echo "tag v$TAG != pubspec ${{ steps.version.outputs.version }} — run tooling/scripts/release.sh" >&2
            exit 1
          }
      - name: Publish only what is not on the release page yet
        id: publish
        # A pubspec edit on main that is not a version bump (a dependency,
        # an asset) lands here too; so does the second of the two pushes
        # above. Neither rebuilds a release that already exists — replacing
        # its assets would change the checksum the Homebrew cask pins.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          WANTS: ${{ github.event_name == 'push' || (inputs.publish && github.ref == 'refs/heads/main') }}
        run: |
          if [ "$WANTS" != "true" ]; then
            echo "Dry run: building without publishing."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::v$VERSION is already released; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the release notes
        # github.md is the release body; release_notes.json is what every
        # build below bundles for the app's "What's new" sheet.
        run: |
          python3 tooling/scripts/release_notes.py "${{ steps.version.outputs.version }}" \
            --github notes/github.md --app-asset notes/release_notes.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/*

  web:
    # Sennit Web: the app compiled for the browser, which phones download on
    # demand and serve to a paired browser. Not shipped inside any app. The
    # archive's manifest is signed with SENNIT_WEB_SIGNING_KEY, whose public
    # half is in packages/weft_remote/lib/src/web_bundle.dart; without the
    # secret the job builds and stops, and the release has no web bundle —
    # every app then says the bundle is not available for its version.
    needs: verify
    if: needs.verify.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SENNIT_WEB_SIGNING_KEY: ${{ secrets.SENNIT_WEB_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Bundle the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/weft/assets
      - run: flutter pub get
      # --no-web-resources-cdn: CanvasKit comes from the phone, not from a
      # Google CDN — the browser talks to nobody but the phone.
      - run: flutter build web --release --no-web-resources-cdn ${{ env.DIRECT_DEFINES }}
        working-directory: apps/weft
      - run: tooling/scripts/fetch_sqlite_wasm.sh apps/weft/build/web
      - name: Pack and sign
        if: env.SENNIT_WEB_SIGNING_KEY != ''
        run: dart run tooling/scripts/package_web_bundle.dart apps/weft/build/web "$VERSION" dist
      - name: No signing key
        if: env.SENNIT_WEB_SIGNING_KEY == ''
        run: |
          echo "::warning::SENNIT_WEB_SIGNING_KEY is not set; this release has no Sennit Web bundle."
          mkdir -p dist && touch dist/.keep
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: ignore

  android:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    # x64 Linux. Not linux-arm64: Flutter's AOT host tooling (gen_snapshot)
    # is published for linux-x64 only, and AGP resolves aapt2 as
    # com.android.tools.build:aapt2:<ver>:linux, which is x86_64. Not the
    # hosted Mac either: it has 7G of memory, and the build below needs more.
    # The Linux-only steps are gated on runner.os so the job still works on a
    # Mac with an Android SDK.
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        if: runner.os == 'Linux'
        # The fat APK carries every ABI's ONNX, whisper and vodozemac binaries;
        # with the NDK, Gradle caches and Rust artifacts on top, the stock
        # runner disk runs dry mid-link. None of this preinstalled tooling is
        # used here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell \
            /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Keep the build inside the runner's memory
        if: runner.os == 'Linux'
        # gradle.properties asks for an 8G heap and 4G metaspace, sized for a
        # development machine. With the Kotlin daemon, R8 and four Rust
        # cross-compiles alongside, that OOM-kills the 16G runner — twice now,
        # both times as a bare "runner received a shutdown signal" ~35 minutes
        # into assembleRelease. Properties files take the last occurrence of a
        # key, so appending overrides for CI only; the swapfile absorbs the
        # peak that remains. Not /swapfile: the image already swaps there.
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\norg.gradle.workers.max=2\n' \
            >> apps/weft/android/gradle.properties
          sudo fallocate -l 8G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile > /dev/null
          sudo swapon /ci-swapfile
          free -h | head -3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Restore the Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-android-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-
      - name: Locate the Android SDK
        # The hosted image sets ANDROID_HOME; the Android Studio default on a
        # Mac is the fallback.
        run: echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}" >> "$GITHUB_ENV"
      - name: Put rustup's Rust ahead of Homebrew's
        # A Homebrew `rust` ships the std for the host only; when its rustc
        # wins on PATH, cargokit's vodozemac build fails with "can't find
        # crate for `core`" for every Android target rustup has installed.
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Accept the Android SDK licenses
        # whisper_ggml pins an NDK the runner image does not preinstall, and
        # its download stops at the unaccepted license.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install the release keystore
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/weft/android/app/upload-keystore.jks
          cat > apps/weft/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Bundle the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/weft/assets
      - run: flutter pub get
        working-directory: apps/weft
      - run: flutter build apk --release ${{ env.DIRECT_DEFINES }}
        working-directory: apps/weft
      - run: flutter build appbundle --release ${{ env.STORE_DEFINES }} ${{ env.PLAY_DEFINES }}
        working-directory: apps/weft
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp apps/weft/build/app/outputs/flutter-apk/app-release.apk "dist/Sennit-$VERSION-android.apk"
          cp apps/weft/build/app/outputs/bundle/release/app-release.aab "dist/Sennit-$VERSION-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libsqlite3-dev libjpeg-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Bundle the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/weft/assets
      - run: flutter pub get
        working-directory: apps/weft
      - run: flutter build linux --release ${{ env.DIRECT_DEFINES }}
        working-directory: apps/weft
      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Flutter writes the bundle under the host architecture's directory.
          # Name the tarball for what was actually built, so a move to an
          # arm64 runner cannot ship an arm64 bundle in a file that says x64.
          set -- apps/weft/build/linux/*/release/bundle
          bundle=$1
          arch=$(basename "$(dirname "$(dirname "$bundle")")")
          tar -czf "dist/Sennit-$VERSION-linux-$arch.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Bundle the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/weft/assets
      - run: flutter pub get
        working-directory: apps/weft
      - run: flutter build windows --release ${{ env.DIRECT_DEFINES }}
        working-directory: apps/weft
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/weft/build/windows/x64/runner/Release/* `
            -DestinationPath "dist/Sennit-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    runs-on: macos-latest
    outputs:
      # Whether the zip passes Gatekeeper; only then does the cask follow it.
      notarized: ${{ steps.notarize.outputs.notarized }}
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      # Notarization uses the App Store Connect API key the TestFlight
      # upload already signs with, rather than an Apple ID and an
      # app-specific password.
      HAS_NOTARY: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 != '' }}
      VERSION: ${{ needs.verify.outputs.version }}
      APP: apps/weft/build/macos/Build/Products/Release/Sennit.app
      # Signed into the bundle by hand below, because the build runs with
      # signing off and so never applies them. Without them the release ran
      # outside the sandbox the debug build runs in, and under the hardened
      # runtime Developer ID requires, calls would capture no audio or video.
      APP_ENTITLEMENTS: apps/weft/macos/Runner/Release.entitlements
      WIDGET_ENTITLEMENTS: apps/weft/ios/WeftWidget/WeftWidget-macOS.entitlements
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore the CocoaPods and Cargo caches
        # download.onnxruntime.ai, where the onnxruntime-c pod downloads
        # from, serves a certificate for *.azureedge.net and fails every
        # fresh download. deploy_testflight.yml keeps the pod in this cache,
        # under this key, and a cache main saved is one every branch and
        # tag can restore.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-downloads-${{ runner.arch }}-${{ hashFiles('apps/weft/ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: ios-downloads-${{ runner.arch }}-
      - name: Bundle the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/weft/assets
      - run: flutter pub get
        working-directory: apps/weft
      - name: Build (signing deferred)
        # The runner has no signing identity, so the in-build CodeSign step
        # would fail on the first embedded framework. Build with signing off,
        # then sign the whole bundle below: with the Developer ID certificate
        # when the secrets exist, ad hoc when they don't.
        run: |
          flutter build macos --release --config-only ${{ env.DIRECT_DEFINES }}
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: apps/weft
      - name: Restore the framework layout
        # The runner's vodozemac framework loses symlinks in its bundle,
        # which makes the bundle "ambiguous" to codesign, while the version
        # directory never is. Put the canonical links back first so the
        # sealed layout is also a valid one.
        run: |
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            name=$(basename "$fw" .framework)
            if [ -d "$fw/Versions/A" ]; then
              ln -sfn A "$fw/Versions/Current"
              [ -e "$fw/$name" ] || ln -s "Versions/Current/$name" "$fw/$name"
              if [ -d "$fw/Versions/A/Resources" ] && [ ! -e "$fw/Resources" ]; then
                ln -s "Versions/Current/Resources" "$fw/Resources"
              fi
            fi
          done
      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the .p12" >&2; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Codesign
        # Nested code first, then the app — never --deep, which would give
        # every framework the app's entitlements — and via Versions/A where
        # one exists. With the certificate, Developer ID with the hardened
        # runtime and a timestamp, as notarization requires; without it, ad
        # hoc, which runs after right-click → Open.
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            SIGN=(codesign --force --options runtime --timestamp --sign "$IDENTITY")
          else
            SIGN=(codesign --force --sign -)
          fi
          # The entitlements files explain themselves in comments with `--`
          # in them, which codesign's parser rejects. Xcode would hand it a
          # normalised copy; signing by hand has to make one.
          plutil -convert xml1 -o "$RUNNER_TEMP/app.entitlements" "$APP_ENTITLEMENTS"
          plutil -convert xml1 -o "$RUNNER_TEMP/widget.entitlements" "$WIDGET_ENTITLEMENTS"
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            if [ -d "$fw/Versions/A" ]; then
              "${SIGN[@]}" "$fw/Versions/A"
            else
              "${SIGN[@]}" "$fw"
            fi
          done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.dylib' -print0 \
            | while IFS= read -r -d '' lib; do "${SIGN[@]}" "$lib"; done
          for appex in "$APP/Contents/PlugIns"/*.appex; do
            [ -e "$appex" ] && "${SIGN[@]}" --entitlements "$RUNNER_TEMP/widget.entitlements" "$appex"
          done
          "${SIGN[@]}" --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q com.apple.security.app-sandbox
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q com.apple.security.device.audio-input
      - name: Notarize and staple
        id: notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm "$RUNNER_TEMP/AuthKey.p8"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json" || {
            echo "notarization was not accepted" >&2
            exit 1
          }
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # What a Homebrew or browser download is judged by.
          spctl --assess --type execute --verbose=2 "$APP"
          echo "notarized=true" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Sennit-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  ios:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore the CocoaPods and Cargo caches
        # download.onnxruntime.ai, where the onnxruntime-c pod downloads
        # from, serves a certificate for *.azureedge.net and fails every
        # fresh download. deploy_testflight.yml keeps the pod in this cache,
        # under this key, and a cache main saved is one every branch and
        # tag can restore.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-downloads-${{ runner.arch }}-${{ hashFiles('apps/weft/ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: ios-downloads-${{ runner.arch }}-
      - name: Bundle the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/weft/assets
      - run: flutter pub get
        working-directory: apps/weft
      - name: Import the distribution certificate and profile
        if: env.HAS_SIGNING == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/braid.mobileprovision
      - name: Build a signed IPA
        if: env.HAS_SIGNING == 'true'
        run: flutter build ipa --release ${{ env.STORE_DEFINES }} ${{ env.APP_STORE_DEFINES }}
        working-directory: apps/weft
      - name: Build an unsigned IPA
        if: env.HAS_SIGNING != 'true'
        # Not `flutter build ios`: the tool passes `-sdk iphoneos`, which
        # forces the *watch companion* target onto the iOS SDK and fails on
        # every watchOS-only API. A generic iOS destination lets each target
        # pick its own SDK, exactly as an Xcode archive would.
        run: |
          (cd apps/weft && flutter build ios --release --config-only --no-codesign ${{ env.STORE_DEFINES }} ${{ env.APP_STORE_DEFINES }})
          xcodebuild -workspace apps/weft/ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath apps/weft/build/ios_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R apps/weft/build/ios_dd/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry unsigned.ipa Payload
      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ "$HAS_SIGNING" = "true" ]; then
            cp apps/weft/build/ios/ipa/*.ipa "dist/Sennit-$VERSION-ios.ipa"
          else
            cp unsigned.ipa "dist/Sennit-$VERSION-ios-unsigned.ipa"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    needs: [verify, android, linux, windows, macos, ios, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Take the release notes out of the files
        run: |
          mv dist/github.md "$RUNNER_TEMP/release-notes.md"
          rm dist/release_notes.json
          ls -la dist/
      - name: Publish the GitHub release
        if: needs.verify.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # On a main push this creates the tag, on the commit that was built.
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sennit ${{ needs.verify.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*

  homebrew:
    # `brew install --cask bostrot/tap/sennit` installs the macOS zip from the
    # release page, so the cask in bostrot/homebrew-tap follows each release
    # that carries a notarized one. Homebrew quarantines what it installs:
    # pointing the cask at an ad hoc build would make every install open as
    # "damaged", which is worse than leaving it a version behind.
    #
    # HOMEBREW_TAP_DEPLOY_KEY is the private half of a deploy key with write
    # access on bostrot/homebrew-tap. Without it, or without a notarized
    # build, this job does not run.
    needs: [verify, macos, publish]
    if: needs.verify.outputs.publish == 'true' && needs.macos.outputs.notarized == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump the cask to the zip the release serves
        if: env.TAP_DEPLOY_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "Sennit-$VERSION-macos.zip" --dir "$RUNNER_TEMP"
          tooling/scripts/update_homebrew_cask.sh "$VERSION" "$RUNNER_TEMP/Sennit-$VERSION-macos.zip"
