name: Release

# Cutting a release: run tooling/scripts/release.sh <version>, then
#   git push && git push origin v<version>
# The tag drives everything below; pubspec.yaml stays the single source of
# truth and the verify job refuses a tag that doesn't match it.
#
# workflow_dispatch builds all platforms without publishing — a dry run.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  verify:
    # On the Mac rather than the Linux runner: every other job waits on this
    # one, and the Linux box has been offline since September, which held
    # the android job in the queue for good. It only reads pubspec.yaml.
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from pubspec.yaml
        id: version
        run: |
          VERSION=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' apps/weft/pubspec.yaml)
          [ -n "$VERSION" ] || { echo "pubspec version is not semver+build" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec says $VERSION"
      - name: The tag must match pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [ "$TAG" = "${{ steps.version.outputs.version }}" ] || {
            echo "tag v$TAG != pubspec ${{ steps.version.outputs.version }} — run tooling/scripts/release.sh" >&2
            exit 1
          }

  android:
    needs: verify
    # A self-hosted Mac, not the Linux box the other jobs use. An Android
    # release build cannot happen on linux-arm64 — Flutter's AOT host tooling
    # (gen_snapshot) is published for linux-x64 only, and AGP resolves aapt2
    # as com.android.tools.build:aapt2:<ver>:linux, which is x86_64 — while
    # Apple silicon has both: Flutter ships macos-arm64 and Google ships
    # darwin-aarch64 build-tools. The GitHub-hosted-only steps below are
    # gated on runner.os so the job still works on ubuntu-latest if it ever
    # goes back there.
    #
    # `android` picks the Mac with the toolchain — see deploy_internal.yml.
    runs-on: [self-hosted, macOS, ARM64, android]
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        if: runner.os == 'Linux'
        # The fat APK carries every ABI's ONNX, whisper and vodozemac binaries;
        # with the NDK, Gradle caches and Rust artifacts on top, the stock
        # runner disk runs dry mid-link. None of this preinstalled tooling is
        # used here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell \
            /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Keep the build inside the runner's memory
        if: runner.os == 'Linux'
        # gradle.properties asks for an 8G heap and 4G metaspace, sized for a
        # development machine. With the Kotlin daemon, R8 and four Rust
        # cross-compiles alongside, that OOM-kills the 16G runner — twice now,
        # both times as a bare "runner received a shutdown signal" ~35 minutes
        # into assembleRelease. Properties files take the last occurrence of a
        # key, so appending overrides for CI only; the swapfile absorbs the
        # peak that remains.
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\norg.gradle.workers.max=2\n' \
            >> apps/weft/android/gradle.properties
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile > /dev/null
          sudo swapon /swapfile
          free -h | head -3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Locate the Android SDK
        # A self-hosted runner only carries ANDROID_HOME if its .env says so;
        # the Android Studio default on a Mac is the fallback.
        run: echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}" >> "$GITHUB_ENV"
      - name: Put rustup's Rust ahead of Homebrew's
        # A Homebrew `rust` ships the std for the host only; when its rustc
        # wins on PATH, cargokit's vodozemac build fails with "can't find
        # crate for `core`" for every Android target rustup has installed.
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Accept the Android SDK licenses
        # whisper_ggml pins an NDK the runner image does not preinstall, and
        # its download stops at the unaccepted license.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install the release keystore
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/weft/android/app/upload-keystore.jks
          cat > apps/weft/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: flutter pub get
        working-directory: apps/weft
      - run: flutter build apk --release
        working-directory: apps/weft
      - run: flutter build appbundle --release
        working-directory: apps/weft
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp apps/weft/build/app/outputs/flutter-apk/app-release.apk "dist/Braid-$VERSION-android.apk"
          cp apps/weft/build/app/outputs/bundle/release/app-release.aab "dist/Braid-$VERSION-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    needs: verify
    runs-on: [self-hosted, Linux, debian]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libsqlite3-dev
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: apps/weft
      - run: flutter build linux --release
        working-directory: apps/weft
      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Flutter writes the bundle under the host architecture's directory,
          # and this runner is arm64 — build/linux/x64 no longer exists. Name
          # the tarball for what was actually built rather than shipping an
          # arm64 bundle inside a file that claims to be x64.
          set -- apps/weft/build/linux/*/release/bundle
          bundle=$1
          arch=$(basename "$(dirname "$(dirname "$bundle")")")
          tar -czf "dist/Braid-$VERSION-linux-$arch.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/weft
      - run: flutter build windows --release
        working-directory: apps/weft
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/weft/build/windows/x64/runner/Release/* `
            -DestinationPath "dist/Braid-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/weft
      - name: Build (signing deferred)
        # The runner has no signing identity, so the in-build CodeSign step
        # would fail on the first embedded framework. Build with signing off,
        # then seal the whole bundle ad hoc below; the Developer ID step
        # re-signs on top when the secrets exist.
        run: |
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: apps/weft
      - name: Ad-hoc sign
        # Nested code first, then the app — never --deep, and via Versions/A
        # where one exists: the runner's vodozemac framework loses symlinks in
        # its bundle, which makes the bundle "ambiguous" to codesign, while
        # the version directory never is. The repair loop puts the canonical
        # links back first so the sealed layout is also a valid one.
        run: |
          APP=apps/weft/build/macos/Build/Products/Release/Braid.app
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            name=$(basename "$fw" .framework)
            if [ -d "$fw/Versions/A" ]; then
              ln -sfn A "$fw/Versions/Current"
              [ -e "$fw/$name" ] || ln -s "Versions/Current/$name" "$fw/$name"
              [ -d "$fw/Versions/A/Resources" ] && { [ -e "$fw/Resources" ] || ln -s "Versions/Current/Resources" "$fw/Resources"; }
              codesign --force --sign - "$fw/Versions/A"
            else
              codesign --force --sign - "$fw"
            fi
          done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.dylib' \
            -exec codesign --force --sign - {} +
          for appex in "$APP/Contents/PlugIns"/*.appex; do
            [ -e "$appex" ] && codesign --force --sign - "$appex"
          done
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP"
      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Codesign
        if: env.HAS_SIGNING == 'true'
        run: |
          APP=apps/weft/build/macos/Build/Products/Release/Braid.app
          for fw in "$APP/Contents/Frameworks"/*.framework; do
            if [ -d "$fw/Versions/A" ]; then
              codesign --force --options runtime --timestamp \
                --sign "Developer ID Application" "$fw/Versions/A"
            else
              codesign --force --options runtime --timestamp \
                --sign "Developer ID Application" "$fw"
            fi
          done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.dylib' \
            -exec codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" {} +
          for appex in "$APP/Contents/PlugIns"/*.appex; do
            [ -e "$appex" ] && codesign --force --options runtime --timestamp \
              --sign "Developer ID Application" "$appex"
          done
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" "$APP"
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            apps/weft/build/macos/Build/Products/Release/Braid.app \
            "dist/Braid-$VERSION-macos.zip"
      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool submit "dist/Braid-$VERSION-macos.zip" --wait \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"
          xcrun stapler staple \
            apps/weft/build/macos/Build/Products/Release/Braid.app
          rm dist/*.zip
          ditto -c -k --keepParent \
            apps/weft/build/macos/Build/Products/Release/Braid.app \
            "dist/Braid-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  ios:
    needs: verify
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/weft
      - name: Import the distribution certificate and profile
        if: env.HAS_SIGNING == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/braid.mobileprovision
      - name: Build a signed IPA
        if: env.HAS_SIGNING == 'true'
        run: flutter build ipa --release
        working-directory: apps/weft
      - name: Build an unsigned IPA
        if: env.HAS_SIGNING != 'true'
        # Not `flutter build ios`: the tool passes `-sdk iphoneos`, which
        # forces the *watch companion* target onto the iOS SDK and fails on
        # every watchOS-only API. A generic iOS destination lets each target
        # pick its own SDK, exactly as an Xcode archive would.
        run: |
          (cd apps/weft && flutter build ios --release --config-only --no-codesign)
          xcodebuild -workspace apps/weft/ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath apps/weft/build/ios_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R apps/weft/build/ios_dd/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry unsigned.ipa Payload
      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ "$HAS_SIGNING" = "true" ]; then
            cp apps/weft/build/ios/ipa/*.ipa "dist/Braid-$VERSION-ios.ipa"
          else
            cp unsigned.ipa "dist/Braid-$VERSION-ios-unsigned.ipa"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    needs: [verify, android, linux, windows, macos, ios]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist/
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Braid ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: dist/*
