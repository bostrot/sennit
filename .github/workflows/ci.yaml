name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Linux jobs run on the self-hosted `debian` runner rather than
# ubuntu-latest. GitHub-hosted minutes are unavailable on this account — every
# hosted job now ends in seconds with "the job was not started because recent
# account payments have failed or your spending limit needs to be increased" —
# and a self-hosted runner is not billed.
#
# That runner is arm64 (Apple Virtualization guest), which is why these jobs
# install Flutter through .github/actions/setup-flutter instead of
# subosito/flutter-action: there is no linux-arm64 Flutter archive to download.
# See that action for the detail.
#
# The macOS jobs below keep subosito/flutter-action — Flutter does publish
# macos-arm64 archives — and stay on GitHub-hosted runners, so they remain
# blocked on billing until that is settled.

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  analyze:
    name: Analyze & format
    runs-on: [self-hosted, Linux, debian]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # Tracked sources only. `dart format` has no exclude of its own, and a
      # macOS build leaves generated Dart inside build/ (vodozemac's build
      # tool) that is not ours to format — which made passing depend on which
      # artifacts sat in the checkout.
      - name: Check formatting
        run: git ls-files '*.dart' -z | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      # Localisation, in the cheapest order. `gen-l10n` fails on a malformed
      # ARB, a placeholder with no metadata or an `@key` block somebody forgot,
      # and it catches more than the other two for a fraction of the time —
      # `flutter analyze` above then fails on a key the generator did not
      # produce. The audit is last because it is the one that reads the whole
      # app, and it exits non-zero on a single user-facing literal that has not
      # been extracted: see `docs/architecture/l10n-pipeline.md`.
      - name: Generate localisations
        run: cd apps/weft && flutter gen-l10n
      - name: Audit for unextracted strings
        run: dart run tooling/scripts/l10n_audit.dart
      # The audit above asks whether a string reached a catalogue. This asks
      # whether what reached it is usable in the locale it landed in: the
      # placeholders the call site passes still present, the ICU parsing, the
      # string actually translated, and short enough for the space the widget
      # has. All four are invisible to a reviewer who does not read the
      # language, which is what makes them a CI step rather than a review note.
      - name: Lint the translations
        run: dart run tooling/scripts/l10n_lint.dart

  unit:
    name: Unit tests (pure Dart)
    runs-on: [self-hosted, Linux, debian]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # These packages carry the algorithmic core — merge scoring, the merged
      # timeline watermark, hybrid search ranking, attachment planning, the
      # notification decision rules, the share target ranking, the formatted
      # -body allowlist, SMS segment counting and phone-number identity, call
      # glare resolution and ICE candidate ordering, and what a home screen
      # widget or a watch is allowed to say about a conversation — and need no
      # device. A package absent from this list is silently untested, so adding
      # one to the workspace means adding it here too.
      - name: Test the pure-Dart packages
        run: |
          set -e
          for pkg in weft_domain weft_merge weft_search weft_bridges weft_transcribe weft_mcp weft_attachments weft_notify weft_share weft_snapshot weft_richtext weft_sms weft_call weft_backup weft_autoreply; do
            if [ -d "packages/$pkg/test" ]; then
              echo "::group::$pkg"
              (cd "packages/$pkg" && dart test --reporter expanded)
              echo "::endgroup::"
            fi
          done

  widget:
    name: Widget & golden tests
    # macOS, not ubuntu: the golden files are rendered on macOS and font
    # rasterization differs per platform — Linux fails every golden on pixels.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # These three depend on the Flutter SDK — weft_matrix on `compute` and the
      # SDK's own Flutter-only bindings, weft_store on sqflite, weft_design on
      # the widget layer it is made of — so they cannot run under `dart test` in
      # the unit job above, and belong here instead of going unrun. The upload
      # transport lives in weft_matrix.
      #
      # weft_design was absent from both lists until M10 and its whole suite went
      # unrun in CI, `contrast_test.dart` included — which is the one test that
      # would notice a token dropping below WCAG AA, i.e. exactly the regression
      # nobody sees by looking.
      - name: Test weft_matrix, weft_store, weft_design
        run: |
          set -e
          for pkg in weft_matrix weft_store weft_design; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && flutter test)
            echo "::endgroup::"
          done
      - run: flutter test
        working-directory: apps/weft
      # Goldens are font- and platform-sensitive; publishing the diff makes a
      # failure diagnosable without reproducing the runner locally.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/weft/test/**/failures/**
          if-no-files-found: ignore

  a11y:
    name: Accessibility & RTL
    # Same macOS constraint as the widget job: the contrast sweep samples
    # rendered pixels, and Linux text rasterization shifts them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # A subset of what the `widget` job already runs, on purpose. Two reasons
      # it is worth the overlap, both about the report rather than the coverage:
      # a red X reading "Accessibility & RTL" says what broke without anyone
      # opening a log, and these suites finish in well under a minute, so they
      # fail while the full widget run is still going.
      #
      # `test/a11y` is also where the *source sweep* lives. `rtl_test.dart` reads
      # the tree's bytes looking for physical-edge layout APIs —
      # `EdgeInsets.only(left:)`, `Alignment.centerLeft`, `Positioned(right:)` —
      # which is deliberately a test and not a `grep` step here: BSD and GNU grep
      # classify two files in this workspace as binary and drop their matches
      # *silently*, so a grep-based compliance check under-reports without
      # saying so. See the audit's Method note. Adding one here would give two
      # checks that disagree.
      - name: Semantics, keyboard, RTL, contrast and tap targets
        working-directory: apps/weft
        run: flutter test test/a11y
      # The accessibility golden variants — Arabic, 0.85×, 2.0× and high
      # contrast over five scenes in both themes, 40 images. Separate from the
      # suite above because a golden failure is diagnosed from the artifact
      # below rather than from the log.
      - name: Golden variants (RTL, text scale, high contrast)
        working-directory: apps/weft
        run: flutter test test/goldens
      - name: Token contrast, tap targets and bidi
        working-directory: packages/weft_design
        run: flutter test
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-golden-failures
          path: apps/weft/test/**/failures/**
          if-no-files-found: ignore

  route-walk:
    name: Route walk & UI audit
    # ubuntu-latest, and it needs no homeserver: the walk boots the app in demo
    # mode and every assertion it makes is inside the view. That is also why it
    # is here rather than in `e2e.yaml` — see `integration_test/patrol/README.md`
    # for the rule it is on the other side of.
    #
    # Linux draws the touch shell (`weft_design/src/surface.dart`), so this row
    # is the *phone* layout. The Mac window's layout is walked by running the
    # same file with `-d macos`, which needs a Mac and is a local and release
    # step rather than a per-push one; `docs/quality/ui-audit.md` records both.
    runs-on: [self-hosted, Linux, debian]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # A real engine on a real desktop target, which is what `integration_test`
      # requires — `flutter test` refuses to run a file under `integration_test/`
      # without a device.
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libsqlite3-dev xvfb gnome-keyring dbus-x11 pulseaudio libpulse-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Walk every route
        working-directory: apps/weft
        env:
          WEFT_SHOT_DIR: ${{ github.workspace }}/route-walk
        run: |
          export "$(dbus-launch)"
          echo -n "" | gnome-keyring-daemon --unlock --replace --components=secrets || true
          pulseaudio --start --exit-idle-time=-1 || true
          xvfb-run -a flutter test integration_test/route_walk_test.dart \
            -d linux --dart-define=WEFT_DEMO=true \
            --dart-define=WEFT_SHOT_DIR="$WEFT_SHOT_DIR"
      # The screenshots and the findings file, on failure *and* on success. A
      # walk that fails is diagnosed from the image of the screen it failed on
      # and from nothing else — the log has a finder in it, not a picture — and
      # a walk that passes still produced the audit's work list, which is the
      # other half of what this job is for.
      - name: Upload the walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-walk
          path: route-walk/**
          if-no-files-found: warn

  integration:
    name: Integration tests (against Synapse)
    runs-on: [self-hosted, Linux, debian]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Generate Synapse config
        run: |
          docker run --rm -v "$PWD/tooling/docker/synapse-data:/data" \
            -e SYNAPSE_SERVER_NAME=localhost -e SYNAPSE_REPORT_STATS=no \
            matrixdotorg/synapse:latest generate
      - name: Open registration for the test stack
        run: |
          # `generate` ran inside the container as root, so the tree it wrote
          # is root-owned and the append below would be refused. And once the
          # append is done the tree has to open up again: the server runs as
          # the container's synapse user (991), which is nobody here.
          sudo chown -R "$(id -u):$(id -g)" tooling/docker/synapse-data
          cat >> tooling/docker/synapse-data/homeserver.yaml <<'EOF'

          enable_registration: true
          enable_registration_without_verification: true
          registration_shared_secret: "weft-test-shared-secret"
          rc_login:
            address: { per_second: 100, burst_count: 100 }
            account: { per_second: 100, burst_count: 100 }
          rc_registration:
            per_second: 100
            burst_count: 100
          EOF
          sudo chmod -R a+rwX tooling/docker/synapse-data
      - name: Start homeserver
        run: docker compose -f tooling/docker/compose.yaml up -d --wait
      - name: Seed test accounts
        run: ./tooling/docker/seed.sh
      # The integration tests drive a real Flutter engine, so they need a
      # desktop target and a display even though nothing is rendered.
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libsqlite3-dev xvfb gnome-keyring dbus-x11 pulseaudio libpulse-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      # WEFT_DEMO is what `attachment_flow_test` drives the app in; the
      # homeserver tests build their own session and never read it, so one run
      # covers both.
      #
      # `route_walk_test.dart` is deliberately skipped here and has a job of its
      # own above: it needs no homeserver, so running it inside this one would
      # spend a Synapse on it and report its failures under a name that says
      # "against Synapse". Every *other* top-level integration test is picked up
      # by the glob without touching this line.
      #
      # `integration_test/*_test.dart` and not `integration_test`: the glob is
      # what keeps `integration_test/patrol/` out. Those are Patrol tests, and
      # `patrolTest` calls `PatrolBinding.ensureInitialized` while the file is
      # being *loaded* — a Live binding, which the automated binding
      # `flutter test` installs cannot coexist with. The failure is a binding
      # conflict at load, so it takes the whole run down rather than one file,
      # and `--exclude-tags` cannot prevent it because registration has already
      # happened by then. The device suite runs from `e2e.yaml` via
      # `tooling/scripts/e2e.sh`. New top-level integration tests are picked up
      # by the glob without touching this line.
      - name: Run integration tests
        working-directory: apps/weft
        # The desktop app is headless here but not self-sufficient: secure
        # storage wants a Secret Service on the session bus, and the call
        # stack wants an audio server. Without them the app dies before the
        # test harness ever connects ("log reader never started").
        run: |
          export "$(dbus-launch)"
          echo -n "" | gnome-keyring-daemon --unlock --replace --components=secrets || true
          pulseaudio --start --exit-idle-time=-1 || true
          # One flutter test invocation per file, each with its own XDG tree
          # and no survivor processes: a leftover app from the previous file
          # holds the database and the next launch dies before the harness
          # connects. On failure, launch the built bundle directly so its
          # stderr — which the harness swallows — lands in the log.
          fail=0
          for f in integration_test/*_test.dart; do
            [ "$f" = "integration_test/route_walk_test.dart" ] && continue
            echo "::group::$f"
            pkill -f 'bundle/weft' 2>/dev/null || true
            scratch="$(mktemp -d)"
            if ! XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config" \
                XDG_CACHE_HOME="$scratch/cache" \
                xvfb-run -a flutter test "$f" -d linux --dart-define=WEFT_DEMO=true; then
              fail=1
              echo "--- direct launch of the bundle for $f ---"
              timeout 15 xvfb-run -a ./build/linux/*/debug/bundle/weft 2>&1 | head -40 || true
            fi
            echo "::endgroup::"
          done
          exit "$fail"
      - name: Homeserver logs on failure
        if: failure()
        run: docker compose -f tooling/docker/compose.yaml logs synapse
