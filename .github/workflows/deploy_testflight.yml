name: Publish to TestFlight Internal

# The iOS half of deploy_internal.yml: an archive of whatever main is now,
# signed and handed to App Store Connect, where it becomes a TestFlight build
# for internal testers.
#
# Nothing in the repository can sign for iOS — no team, no certificate, no
# profile; see docs/decisions/adr-002-ios-signing-handoff.md — so this leans
# on an App Store Connect API key instead: with one, xcodebuild creates the
# certificate and writes the profiles for every target itself
# (`-allowProvisioningUpdates`), which is seven targets' worth of portal work
# nobody has to do by hand or keep in secrets. What it does not do is put an
# App Group on an App ID; that was done on the portal, once.
#
# Same trigger as deploy_internal.yml: a version bump on main ships to
# internal testers on both stores, and a manual run ships whatever main is.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/weft/pubspec.yaml'
  workflow_dispatch:
    inputs:
      app_store:
        description: Upload a build that can be submitted to the App Store
        type: boolean
        default: false
      dry_run:
        description: Archive and sign an IPA, but do not upload it
        type: boolean
        default: false

# Two archives of one commit carry one build number, and App Store Connect
# refuses the second.
concurrency:
  group: testflight-internal
  cancel-in-progress: false

# Bump together with release.yml and deploy_internal.yml.
env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build:
    name: Archive and upload to TestFlight
    # Needs Xcode, which the hosted image carries, and CocoaPods and rustup
    # with it. Hosted minutes are free for a public repository.
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The App Store Connect key and the team must exist
        # As in deploy_internal.yml: uploading is all this is for, so a
        # missing secret is a failure and not a skip.
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY_P8_BASE64"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Put rustup's Rust first on PATH
        # flutter_vodozemac needs rustup's toolchains, not a Homebrew rustc
        # that only knows the host. CocoaPods wants a UTF-8 locale.
        run: |
          [ -d "$HOME/.cargo/bin" ] && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/weft

      - name: Restore the CocoaPods and Cargo caches
        uses: actions/cache@v4
        with:
          path: |
            apps/weft/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-${{ runner.arch }}-${{ hashFiles('apps/weft/ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: ios-${{ runner.arch }}-

      - name: Configure the build
        # The commit count, as on Play: one number for the same commit on
        # both stores, rising with every commit and needing no bump. The
        # extensions and the watch app read it from Generated.xcconfig, and
        # an appex whose version differs from its host is refused at upload.
        # The build details for Settings → About ride along in the same
        # file: --config-only writes the dart-defines into it, and the
        # archive below compiles Dart with them.
        run: |
          ../../tooling/scripts/build_info.sh > "$RUNNER_TEMP/build_info.json"
          flutter build ios --release --config-only --no-codesign \
            --build-number="$(git rev-list --count HEAD)" \
            --dart-define-from-file="$RUNNER_TEMP/build_info.json" \
            --dart-define=BRAID_EDITION=${{ vars.BRAID_STORE_EDITION || 'community' }}
        working-directory: apps/weft

      - name: Create the signing keychain
        # Automatic signing makes an Apple Development certificate the first
        # time it archives on a machine — every run, on a hosted runner — and
        # keeps its private key in the default keychain. A keychain of the
        # job's own, with a password it knows, is what lets codesign use that
        # key without asking anyone.
        run: |
          pass="$(uuidgen)"
          echo "::add-mask::$pass"
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security list-keychains -d user | xargs security list-keychains -d user -s "$kc"
          security default-keychain -s "$kc"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Archive
        # xcodebuild and not `flutter build ipa`: the tool passes
        # `-sdk iphoneos`, which forces the watch companion onto the iOS SDK
        # — see release.yml's ios job. A generic iOS destination lets each
        # target pick its own.
        #
        # Twice, if the first fails: a key Xcode has only just created is not
        # yet one codesign may use without asking, and the partition list
        # that allows it can only be set once the key exists.
        run: |
          archive() {
            xcodebuild archive \
              -workspace apps/weft/ios/Runner.xcworkspace \
              -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Sennit.xcarchive" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              CODE_SIGN_STYLE=Automatic \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
              -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          }
          allow_codesign() {
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          }
          archive || { allow_codesign && archive; }

      - name: Upload to TestFlight
        # `destination: upload` makes the export the upload.
        # `testFlightInternalTestingOnly` keeps the build out of external
        # testing and the App Store, which is what "internal" means here.
        # App Store Connect will not let such a build be attached to a
        # version, so the one that goes to review is a manual run with
        # `app_store` ticked. A push never sets it.
        #
        # A dry run exports the signed IPA to the runner instead, which
        # signs it exactly as the upload would and sends nothing.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${{ inputs.dry_run && 'export' || 'upload' }}</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><${{ inputs.app_store && 'false' || 'true' }}/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sennit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          ls -l "$RUNNER_TEMP/export"

      - name: Revoke the certificate this run made
        # Its private key leaves with the runner, and the portal only takes so
        # many: see tooling/store/revoke_keychain_certificates.py.
        if: always() && env.KEYCHAIN != ''
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: python3 tooling/store/revoke_keychain_certificates.py "$KEYCHAIN"

      - name: Remove the key from the runner
        # A hosted runner is discarded anyway; a reused machine is not.
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ExportOptions.plist"
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true
