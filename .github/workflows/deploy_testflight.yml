name: Publish to TestFlight Internal

# The iOS half of deploy_internal.yml: an archive of whatever main is now,
# signed and handed to App Store Connect, where it becomes a TestFlight build
# for internal testers.
#
# It signs manually, with one Apple Distribution certificate kept as a
# secret and an App Store profile per target fetched from the portal by
# name; both are made by ios_signing.yml, about once a year — see "Renewal"
# in docs/decisions/adr-002-ios-signing-handoff.md. Automatic signing, which
# this used before, made a new certificate on every hosted runner and had to
# revoke it again, and Apple mails the owner about each revocation. Nothing
# here creates or revokes anything on the portal now.
#
# Same trigger as deploy_internal.yml: a version bump on main ships to
# internal testers on both stores, and a manual run ships whatever main is.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/weft/pubspec.yaml'
  workflow_dispatch:
    inputs:
      app_store:
        description: Upload a build that can be submitted to the App Store
        type: boolean
        default: false
      dry_run:
        description: Archive and sign an IPA, but do not upload it
        type: boolean
        default: false

# Two archives of one commit carry one build number, and App Store Connect
# refuses the second.
concurrency:
  group: testflight-internal
  cancel-in-progress: false

# Bump together with release.yml and deploy_internal.yml.
env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build:
    name: Archive and upload to TestFlight
    # Needs Xcode, which the hosted image carries, and CocoaPods and rustup
    # with it. Hosted minutes are free for a public repository. macos-26,
    # because App Store Connect has refused anything built with an SDK older
    # than iOS 26 since 2026-11-19, and macos-15 still defaults to Xcode 16.4
    # (iOS 18.5). release.yml's iOS job builds on the same image.
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        # Explicit rather than the image default, which is the image's to
        # change: the newest Xcode 26 on the runner, or a loud failure before
        # twenty minutes of archiving end in a rejected upload. Xcode 27 is
        # left out while the images carry it only as a preview.
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No /Applications/Xcode_26*.app on this runner; App Store Connect requires the iOS 26 SDK"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::$xcode has the iOS $sdk SDK; App Store Connect requires iOS 26 or later"
            exit 1
          fi
          echo "Building with $xcode, iOS SDK $sdk"

      - name: The App Store Connect key and the team must exist
        # As in deploy_internal.yml: uploading is all this is for, so a
        # missing secret is a failure and not a skip.
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY_P8_BASE64"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$P12" ] || missing="$missing IOS_DISTRIBUTION_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing IOS_DISTRIBUTION_P12_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Put rustup's Rust first on PATH
        # flutter_vodozemac needs rustup's toolchains, not a Homebrew rustc
        # that only knows the host. CocoaPods wants a UTF-8 locale.
        run: |
          [ -d "$HOME/.cargo/bin" ] && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/weft

      - name: Restore the CocoaPods and Cargo caches
        # The download caches only, not apps/weft/ios/Pods. A restored Pods
        # directory makes `pod install` skip work it must redo: 1.0.15's
        # archive restored the one 1.0.14 saved and failed with
        # 'ffmpegkit/FFmpegKitConfig.h' file not found. The key prefix
        # changed with it so that entry is never restored again.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-downloads-${{ runner.arch }}-${{ hashFiles('apps/weft/ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: ios-downloads-${{ runner.arch }}-

      - name: Write the release notes
        # The same text the GitHub release and Play get, from the same commit
        # — see tooling/scripts/release_notes.py. The app bundles it; App
        # Store Connect gets it once the upload is in.
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' apps/weft/pubspec.yaml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 tooling/scripts/release_notes.py "$version" \
            --store "$RUNNER_TEMP/store_notes.txt" \
            --app-asset apps/weft/assets/release_notes.json

      - name: Configure the build
        # The commit count, as on Play: one number for the same commit on
        # both stores, rising with every commit and needing no bump. The
        # extensions and the watch app read it from Generated.xcconfig, and
        # an appex whose version differs from its host is refused at upload.
        # The build details for Settings → About ride along in the same
        # file: --config-only writes the dart-defines into it, and the
        # archive below compiles Dart with them.
        run: |
          ../../tooling/scripts/build_info.sh > "$RUNNER_TEMP/build_info.json"
          flutter build ios --release --config-only --no-codesign \
            --build-number="$(git rev-list --count HEAD)" \
            --dart-define-from-file="$RUNNER_TEMP/build_info.json" \
            --dart-define=BRAID_EDITION=${{ vars.BRAID_STORE_EDITION || 'community' }} \
            --dart-define=SENNIT_STORE=appstore
        working-directory: apps/weft

      - name: Import the distribution certificate
        # Into a keychain of the job's own, with a password it knows, so
        # codesign can use the key without asking anyone. The certificate is
        # the one ios_signing.yml made; a run warns a month before it runs
        # out, and fails once it has.
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          pass="$(uuidgen)"
          echo "::add-mask::$pass"
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$kc" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$pass" "$kc" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$kc"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$kc"
          end=$(security find-certificate -c "Apple Distribution" -p "$kc" \
            | openssl x509 -noout -enddate | cut -d= -f2)
          left=$(( ($(date -j -u -f '%b %e %T %Y %Z' "$end" +%s) - $(date +%s)) / 86400 ))
          echo "The distribution certificate expires $end, in $left days"
          if [ "$left" -lt 0 ]; then
            echo "::error::The distribution certificate expired on $end; renew it (adr-002, \"Renewal\")"
            exit 1
          elif [ "$left" -lt 30 ]; then
            echo "::warning::The distribution certificate expires in $left days, on $end; renew it (adr-002, \"Renewal\")"
          fi

      - name: Install the profiles and sign manually
        # The profiles are not secret and are fetched by name, read-only, so
        # regenerating them needs no secret changed. Only the runner's copy
        # of the project is switched to manual signing.
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          python3 tooling/store/ios_signing.py install-profiles
          python3 tooling/store/ios_signing.py configure-project \
            apps/weft/ios/Runner.xcodeproj/project.pbxproj "${{ secrets.APPLE_TEAM_ID }}"

      - name: Archive
        # xcodebuild and not `flutter build ipa`: the tool passes
        # `-sdk iphoneos`, which forces the watch companion onto the iOS SDK
        # — see release.yml's ios job. A generic iOS destination lets each
        # target pick its own.
        run: |
          xcodebuild archive \
            -workspace apps/weft/ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sennit.xcarchive"

      - name: Upload to TestFlight
        # `destination: upload` makes the export the upload.
        # `testFlightInternalTestingOnly` keeps the build out of external
        # testing and the App Store, which is what "internal" means here.
        # App Store Connect will not let such a build be attached to a
        # version, so the one that goes to review is a manual run with
        # `app_store` ticked — or, once STORE_PROMOTION_ENABLED is true,
        # every upload: promote_to_stores.yml submits the newest one each
        # night. Either way it only reaches the internal group until then.
        #
        # A dry run exports the signed IPA to the runner instead, which
        # signs it exactly as the upload would and sends nothing.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${{ inputs.dry_run && 'export' || 'upload' }}</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
            $(python3 tooling/store/ios_signing.py export-profiles)
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><${{ (inputs.app_store || vars.STORE_PROMOTION_ENABLED == 'true') && 'false' || 'true' }}/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sennit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          # Only a dry run leaves an IPA behind. Xcode 26 creates no export
          # directory at all for an upload, and listing it failed the 1.0.13
          # run after the upload had gone through, skipping the notes below.
          if [ -d "$RUNNER_TEMP/export" ]; then ls -l "$RUNNER_TEMP/export"; fi

      - name: Remove the key from the runner
        # A hosted runner is discarded anyway; a reused machine is not.
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ExportOptions.plist"
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" || true

      - name: Set "What to Test" and "What's New"
        # After the upload, and after the keychain is gone: App Store
        # Connect only lists a build a few minutes after it arrives, and this
        # waits for it. "What's New" lands on the App Store version of the
        # same number when one is open for editing; see the script.
        if: ${{ !inputs.dry_run }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          python3 tooling/store/build_notes.py "$VERSION" \
            "$(git rev-list --count HEAD)" "$RUNNER_TEMP/store_notes.txt"
