name: Android release build

# CI's other jobs never run Gradle in release mode, so a plugin whose Android
# build file a new Android Gradle Plugin refuses (flutter_inappwebview_android
# 1.1.3 under AGP 9) stayed green until the Play upload of a release failed.
# This builds what deploy_internal.yml builds, debug-signed and for one ABI,
# whenever a change can alter the Android build: a dependency, a pubspec, or
# the Android project itself.
on:
  pull_request:
    paths:
      - 'pubspec.lock'
      - '**/pubspec.yaml'
      - 'apps/weft/android/**'
      - '.github/workflows/android_build.yml'
  push:
    branches: [main]
    paths:
      - 'pubspec.lock'
      - '**/pubspec.yaml'
      - 'apps/weft/android/**'
      - '.github/workflows/android_build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The same toolchain as deploy_internal.yml.
env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build:
    name: Build a release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free runner disk space
        # See deploy_internal.yml: the NDK, Gradle caches and the Rust
        # cross-compile do not fit next to the image's preinstalled tooling.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell \
            /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune -af > /dev/null 2>&1 || true

      - name: Keep the build inside the runner's memory
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\norg.gradle.workers.max=2\n' \
            >> apps/weft/android/gradle.properties
          sudo fallocate -l 8G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile > /dev/null
          sudo swapon /ci-swapfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Restore the Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-android-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Locate the Android SDK and rustup's Rust
        # See deploy_internal.yml: rustup's rustc must win over any other.
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          [ -d "$sdk" ] || { echo "::error::No Android SDK at $sdk"; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          [ -x "$HOME/.cargo/bin/rustup" ] || { echo "::error::No rustup in ~/.cargo/bin — flutter_vodozemac needs it"; exit 1; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: flutter pub get

      - name: Generate localisations
        working-directory: apps/weft
        run: flutter gen-l10n

      # No key.properties, so build.gradle.kts signs with the debug key: this
      # checks that release mode builds, not what gets shipped.
      - name: Build
        working-directory: apps/weft
        run: flutter build apk --release --target-platform android-arm64 --dart-define=BRAID_EDITION=store
