# Weft — Dart pub workspace root.
#
# This file exists only to tie the app and packages into a single resolution
# unit; it ships no code of its own. Every member declares `resolution: workspace`.
name: weft_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/weft
  - packages/weft_attachments
  - packages/weft_autoreply
  - packages/weft_backup
  - packages/weft_bridges
  - packages/weft_call
  - packages/weft_design
  - packages/weft_domain
  - packages/weft_matrix
  - packages/weft_mcp
  - packages/weft_merge
  - packages/weft_notify
  - packages/weft_remote
  - packages/weft_richtext
  - packages/weft_search
  - packages/weft_share
  - packages/weft_sms
  - packages/weft_snapshot
  - packages/weft_store
  - packages/weft_sync
  - packages/weft_transcribe

# The workspace root's own dependencies, for the Dart programs under `tooling/`
# that are run with `dart run tooling/scripts/<name>.dart` from here.
#
# `analyzer` is already in the lock at this version as a transitive dependency
# of `build_runner`, so declaring it is a promotion rather than a new package —
# it changes no other resolution, which matters in a workspace that resolves as
# a single unit and has lost packages to analyzer conflicts before.
dev_dependencies:
  analyzer: ^12.1.0
  # For `package_web_bundle.dart`, which zips and signs the browser build.
  # Both already in the lock through the matrix SDK.
  archive: ^4.0.9
  cryptography: ^2.9.0
