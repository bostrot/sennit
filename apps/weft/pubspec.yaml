name: weft
description: "Weft — every conversation, one thread."
publish_to: none
version: 1.0.24+439
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  background_downloader: ^9.5.8
  # Only for the one clock an upload echo reads. `withClock` is what lets a
  # golden of a progress bubble carry a fixed time instead of the minute it
  # happened to be regenerated in.
  clock: ^1.1.2
  collection: ^1.19.0
  file_selector: ^1.1.0
  # Push. Only ever touched behind `NotificationPlatform.supportsPush`, which is
  # Android and iOS — but a pub dependency has no per-platform form, and both of
  # these declare desktop implementations: firebase_messaging builds for macOS
  # and firebase_core for macOS *and* Windows, so they are linked into desktop
  # builds whether or not they are wanted. Calling into them there asks for an
  # APNs token no unsigned desktop Weft has an entitlement for, which is why the
  # guard is a platform check and not a compile-time one.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # Push without Google: a UnifiedPush distributor on the device (ntfy, for
  # one) delivers pokes from the user's own infrastructure, which is the only
  # push story that fits an app whose whole point is self-hosting. Android
  # only; iOS stays on APNs via Firebase.
  unifiedpush: ^6.2.0
  flutter:
    sdk: flutter
  # Material's own strings, and — the reason it is here — `GlobalWidgetsLocalizations`,
  # which is what resolves a locale to a `TextDirection`. Without this the app
  # cannot be put into RTL at all: see `lib/app/localisation.dart`.
  flutter_localizations:
    sdk: flutter
  # The one plugin that draws a notification on all five platforms. Android and
  # Darwin are its own; Linux and Windows come from its federated backends,
  # which is what lets the desktop foreground path post without a gateway.
  flutter_local_notifications: ^22.3.0
  # Already in the tree through the plugin above; declared because the
  # reminder scheduler names its TZDateTime type directly.
  timezone: ^0.11.0
  flutter_riverpod: ^3.3.2
  # WebRTC, and the only place in Weft that talks to it. Everything a call
  # *decides* is in `weft_call`, behind its `MediaEngine` interface; this plugin
  # sits underneath that interface in `services/call/webrtc_media_engine.dart`
  # and nowhere else, which is what keeps glare, candidate ordering and
  # renegotiation testable without a microphone.
  #
  # It pins nothing awkward: its transitive closure is `dart_webrtc`,
  # `webrtc_interface`, `synchronized`, `logging`, `js` and `web` — no
  # `analyzer`, and `webrtc_interface` is a constraint the `matrix` SDK already
  # carries, so the resolution is unchanged for every other package.
  flutter_webrtc: ^1.6.0
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.2.3
  # Directly, only so the Android photo picker can be switched on: the
  # flag lives on the platform implementation and defaults to off. See
  # `attachment_picker.dart`.
  image_picker_android: ^0.8.13
  # And the interface, for the one type needed to reach that flag: the
  # implementation is looked up through `ImagePickerPlatform.instance`.
  image_picker_platform_interface: ^2.10.0
  # Voice-note playback. ExoPlayer on Android and AVPlayer on iOS/macOS decode
  # the ogg/opus that Matrix voice messages actually are on Android; Apple
  # platforms may refuse the container, which surfaces as a readable error
  # rather than a dead button.
  just_audio: ^0.10.6
  # Voice-note recording. Ogg/opus on Android — the container every other
  # Matrix client expects a voice note in — and AAC on Apple platforms, where
  # no opus encoder is available.
  record: ^7.1.1
  # "Add to calendar" on the platforms with a system calendar editor to open.
  # Desktop shares an .ics instead — see agenda_chip.dart.
  add_2_calendar: ^3.1.1
  # One-shot position for "share my location". The permission prompt is the
  # OS's own, asked at the moment of sharing and never before.
  geolocator: ^14.0.2
  intl: any
  matrix: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  scrollable_positioned_list: ^0.3.8
  riverpod_annotation: ^4.0.3
  share_plus: ^13.1.0
  # Opening a link a message carried. Already resolved in the lock as a
  # transitive dependency of the plugins below, so promoting it to a direct one
  # is a declaration rather than a new package.
  url_launcher: ^6.3.2
  video_player: ^2.11.1

  whisper_ggml: ^2.6.0
  # ONNX Runtime bindings for every platform Weft builds on. Runs the local
  # embedding model, so semantic search can work with no endpoint at all.
  flutter_onnxruntime: ^1.8.3

  weft_attachments: ^0.1.0
  # The auto-reply rule engine, for the settings screen and the service.
  weft_autoreply: ^0.1.0
  weft_bridges: ^0.1.0
  weft_call: ^0.1.0
  weft_design: ^0.1.0
  weft_domain: ^0.1.0
  weft_matrix: ^0.1.0
  weft_mcp: ^0.1.0
  weft_merge: ^0.1.0
  weft_notify: ^0.1.0
  weft_richtext: ^0.1.0
  weft_search: ^0.1.0
  weft_share: ^0.1.0
  weft_sms: ^0.1.0
  # The `.sennit` archive format, for the backup screen.
  weft_backup: ^0.1.0
  weft_snapshot: ^0.1.0
  weft_store: ^0.1.0
  weft_transcribe: ^0.1.0
  pdfrx: ^2.4.7
  flutter_contacts: ^2.3.1
  in_app_purchase: ^3.3.1
  fc_native_video_thumbnail: ^4.0.0
  flutter_inappwebview: ^6.1.5
dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # The device suite. Patrol wraps `integration_test` and adds a native
  # automator (UIAutomator on Android, XCUITest on iOS) so a test can touch the
  # share sheet, a permission dialog or the notification shade — the surfaces
  # `flutter test` cannot see. See `docs/quality/e2e-matrix.md`.
  #
  # The counterpart CLI, `patrol_cli`, is deliberately *not* here: it is a
  # global executable (`dart pub global activate patrol_cli`), and putting it in
  # a pubspec would drag a whole command-line toolchain into the workspace's
  # single resolution unit — the same way ObjectBox and Drift were lost to
  # `analyzer` conflicts. `tooling/scripts/e2e.sh` checks for it on PATH.
  patrol: ^4.9.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    # This version's release notes, for the "What's new" sheet. CI writes it
    # before every store and release build (tooling/scripts/release_notes.py);
    # the committed copy is empty, which shows nothing.
    - assets/release_notes.json
  # Turns on `flutter gen-l10n` as part of `flutter pub get` and every build, so
  # `lib/l10n/gen/app_l10n.dart` exists without anyone having to remember to
  # regenerate it. Configured by `l10n.yaml` next to this file; the output is
  # gitignored. Note the `generate: true` further down belongs to
  # `flutter_launcher_icons` and is a different setting entirely.
  generate: true
  # CocoaPods, never Swift Package Manager: the SPM path loses
  # flutter_vodozemac's Versions/Current symlink inside its framework and
  # every code-signing step downstream breaks on the "ambiguous" bundle. The
  # ios and macos Podfiles carry the CocoaPods arrangement that works; this
  # pin is what `flutter config --no-enable-swift-package-manager` did on the
  # development machine, made portable to CI and fresh checkouts.
  config:
    enable-swift-package-manager: false

# Patrol's own configuration, read by `patrol_cli`, not by pub. The ids must
# match the built artefacts or the CLI installs one app and instruments another:
# `applicationId` in `android/app/build.gradle.kts` and
# `PRODUCT_BUNDLE_IDENTIFIER` for the `Runner` target.
patrol:
  app_name: Weft
  # `patrol_cli` 4.7.0 defaults this to a top-level `patrol_test/`. Weft keeps
  # the device suite next to the integration tests it descends from, and — more
  # to the point — outside the reach of `flutter test integration_test`, which
  # CI already runs and which cannot execute a Patrol test. The generated
  # `test_bundle.dart` lands in this directory and is gitignored.
  test_directory: integration_test/patrol
  android:
    package_name: com.bostrot.weft
  ios:
    bundle_id: com.bostrot.weft

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#3D6FD8"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  macos:
    generate: true
    image_path: assets/brand/icon.png
